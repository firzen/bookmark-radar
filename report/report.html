<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="reportPageTitle">Bookmark Radar · 完整报告</title>
  <link rel="stylesheet" href="../popup/popup.css">
  <link rel="stylesheet" href="report.css">
</head>
<body>
  <!-- 顶部 -->
  <header class="header">
    <div class="header-left">
      <h1 data-i18n="reportPageTitle">Bookmark Radar · 完整报告</h1>
      <p class="subtitle" id="reportMeta" data-i18n="loading">加载中...</p>
    </div>
    <div class="header-actions">
      <select id="rescanConcurrency" class="concurrency-select">
        <option value="1" data-i18n="concurrency1">1 并发</option>
        <option value="3" selected data-i18n="concurrency3">3 并发</option>
        <option value="5" data-i18n="concurrency5">5 并发</option>
        <option value="10" data-i18n="concurrency10">10 并发</option>
      </select>
      <label class="force-label" data-i18n-title="tipTimeout">
        <input type="number" id="rescanTimeout" min="5" max="300" value="30"> <span data-i18n="seconds">秒</span>
      </label>
      <label class="force-label" data-i18n-title="tipHuman">
        <input type="checkbox" id="rescanHumanVerify" checked> <span data-i18n="humanVerify">真人验证</span>
      </label>
      <button id="rescanBtn" class="btn-ghost" data-i18n="rescanSelected" data-i18n-title="tipRescan" disabled>重扫选中</button>
      <button id="deleteBtn" class="btn-danger" data-i18n="deleteSelected" data-i18n-title="tipDelete" disabled>删除选中</button>
      <button id="copyBtn" class="btn-ghost" data-i18n="copyText">复制文本</button>
      <button id="exportBtn" class="btn-ghost" data-i18n="exportJson">导出 JSON</button>
      <button id="refreshBtn" class="btn-ghost" data-i18n="refresh">刷新</button>
      <button id="filterUpdatedBtn" class="btn-ghost filter-btn" data-i18n="filterUpdated">仅显示更新</button>
    </div>
  </header>

  <!-- 扫描进度横幅（扫描进行中时显示） -->
  <section id="progressSection" class="progress-section hidden">
    <div class="progress-info">
      <span id="progressText" data-i18n="preparing">准备中...</span>
      <span id="progressCount">0 / 0</span>
    </div>
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <div class="progress-bookmark" id="currentBookmark"></div>
  </section>

  <!-- 报告区域 -->
  <section id="reportSection" class="report-section hidden">
    <!-- 内容分析：摘要 + 状态分组（勾选可重扫/删除） -->
    <div class="summary-bar" id="summaryBar"></div>
    <div id="groupContainer"></div>
  </section>

  <!-- 空状态 -->
  <section id="emptyState" class="empty-state">
    <div class="empty-icon">📡</div>
    <p data-i18n="noData">暂无报告数据</p>
    <p class="empty-hint" data-i18n="noDataHint">请点击插件图标 → 「开始扫描」，完成后此处会自动刷新</p>
  </section>

  <!-- 删除确认弹层 -->
  <div id="confirmOverlay" class="confirm-overlay hidden">
    <div class="confirm-dialog">
      <p class="confirm-msg" id="confirmMsg"></p>
      <div class="confirm-actions">
        <button id="confirmCancel" class="btn-ghost" data-i18n="cancel">取消</button>
        <button id="confirmOk" class="btn-danger" data-i18n="deleteSelected">删除选中</button>
      </div>
    </div>
  </div>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/renderer.js"></script>
  <script src="report.js"></script>
</body>
</html>
